name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/deploy-to-public-7rp52n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Supabase config (公開用キーのみ / Secretsから)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > config.js <<EOF
          /* 自動生成: GitHub Actions が Secrets から作成。公開用(anon)キーのみ。 */
          window.__SUPABASE__ = {
            url: "${SUPABASE_URL}",
            anonKey: "${SUPABASE_ANON_KEY}",
          };
          EOF

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html app.js style.css supabase-client.js sfx.js config.js _site/
          cp -r data _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
