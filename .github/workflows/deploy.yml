name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/deploy-to-public-7rp52n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Supabase config (公開用キーのみ / Secretsから)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > config.js <<EOF
          /* 自動生成: GitHub Actions が Secrets から作成。公開用(anon)キーのみ。 */
          window.__SUPABASE__ = {
            url: "${SUPABASE_URL}",
            anonKey: "${SUPABASE_ANON_KEY}",
          };
          EOF

      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html app.js style.css supabase-client.js sfx.js config.js _site/
          cp manifest.webmanifest _site/
          cp -r data _site/
          cp -r icons _site/

      # ブラウザが古いファイルを使い回さないよう、コミットのSHAを付ける。
      # 特にホーム画面に追加したアプリは独自のキャッシュを持っていて、
      # これが無いと更新しても古いまま動き続けることがある。
      - name: Add cache-busting build id
        run: |
          BUILD="${GITHUB_SHA::12}"
          sed -i \
            -e "s|\./app\.js|./app.js?v=$BUILD|g" \
            -e "s|\./style\.css|./style.css?v=$BUILD|g" \
            -e "s|\./sfx\.js|./sfx.js?v=$BUILD|g" \
            -e "s|\./config\.js|./config.js?v=$BUILD|g" \
            -e "s|\./supabase-client\.js|./supabase-client.js?v=$BUILD|g" \
            -e "s|<title>|<script>window.__BUILD__=\"$BUILD\";</script><title>|" \
            _site/index.html
          echo "build id: $BUILD"
          grep -o 'v=[0-9a-f]\{12\}' _site/index.html | sort -u
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
